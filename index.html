<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRYZ Scripts | Oficial</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --card: #0f0f1a;
            --neon: #00ffff;
            --magenta: #ff00ff;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; }
        
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; }

        header { padding: 20px; text-align: center; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--neon); letter-spacing: 2px; }

        .hero { padding: 60px 20px; text-align: center; background: radial-gradient(circle, #1a1a3a 0%, #050508 100%); }
        h1 { font-size: 2.5rem; margin-bottom: 15px; }
        .neon-txt { color: var(--neon); text-shadow: 0 0 10px var(--neon); }

        .btn-wa {
            display: inline-block;
            background: linear-gradient(90deg, var(--magenta), var(--neon));
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            color: #000;
            font-weight: 800;
            margin-top: 20px;
            transition: 0.3s;
        }

        /* Sección de Juegos */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .game-card:hover { border-color: var(--neon); transform: translateY(-5px); }
        .game-card i { font-size: 2rem; color: var(--magenta); margin-bottom: 10px; display: block; }
        .game-card p { font-size: 0.85rem; font-weight: 600; }

        footer { text-align: center; padding: 40px; color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<audio id="welcome-audio" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
</audio>

<header>
    <div class="logo">VRYZ SCRIPTS</div>
</header>

<section class="hero">
    <h1>Scripts <span class="neon-txt">Premium</span></h1>
    <p>Indetectables y optimizados para Roblox.</p>
    <a href="https://wa.me/584122064697?text=Hola%20VRYZ,%20quiero%20un%20script" class="btn-wa">
        CONTACTAR POR WHATSAPP
    </a>
</section>

<div class="games-grid">
    <div class="game-card"><i class="fas fa-football-ball"></i><p>Football Fusion 3</p></div>
    <div class="game-card"><i class="fas fa-home"></i><p>Brookhaven</p></div>
    <div class="game-card"><i class="fas fa-hands-helping"></i><p>Arrojar Cosas y Personas</p></div>
    <div class="game-card"><i class="fas fa-user-shield"></i><p>Asesinos vs Sheriffs</p></div>
    <div class="game-card"><i class="fas fa-fire"></i><p>Strongest Battlegrounds</p></div>
</div>

<footer>© 2026 VRYZ SCRIPTS - Powered by Github</footer>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('welcome-audio');
    let audioStarted = false;
    let particles = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.size = Math.random() * 8 + 4;
            this.speedX = (Math.random() - 0.5) * 8;
            this.speedY = (Math.random() - 0.5) * 8;
            this.hue = Math.random() * 360;
            this.alpha = 1;
        }
        update() { this.x += this.speedX; this.y += this.speedY; this.alpha -= 0.02; this.hue += 5; }
        draw() {
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = `hsla(${this.hue}, 100%, 50%, ${this.alpha})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }

    window.addEventListener('mousedown', (e) => {
        // Activar música al primer clic
        if(!audioStarted) {
            audio.play();
            audioStarted = true;
        }
        for (let i = 0; i < 5; i++) { particles.push(new Particle(e.clientX, e.clientY)); }
    });

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update(); particles[i].draw();
            if (particles[i].alpha <= 0) { particles.splice(i, 1); i--; }
        }
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
